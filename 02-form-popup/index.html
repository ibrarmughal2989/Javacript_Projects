<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>alistudio | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="menu">
      <a class="logo" href="#">alistudio<span>.</span></a>
      <button id="openForm" type="button">Contact Us</button>
    </nav>
  </header>

  <main>
    <form id="contactForm" aria-labelledby="formTitle">
      <div class="form-heading">
        <h1 id="formTitle">Get in touch</h1>
        <button id="closeForm" type="button" aria-label="Close form">×</button>
      </div>

      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Your name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="How can we help?" required></textarea>

      <button class="send-button" type="submit">Send message</button>
    </form>
  </main>
  <script src="script.js"></script>

</body>
</html>
